services:
  - type: web
    name: rayen-coif
    runtime: node
    plan: free
    branch: main
    buildCommand: >-
      cd client && npm install && npm run build &&
      cd ../server && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      # DB_PATH pointe vers le disque persistant déclaré ci-dessous.
      # Sans ce disque (ou sans cette variable), server/data/salon.db
      # vit sur le filesystem éphémère du conteneur et est perdu à
      # chaque redéploiement / redémarrage : c'est la cause la plus
      # probable de la disparition de l'historique des réservations.
      - key: DB_PATH
        value: /var/data/salon.db
    disk:
      name: rayen-coif-data
      mountPath: /var/data
      sizeGB: 1