services:
  - type: web
    name: rayen-coif
    runtime: node

    # La base de données ne vit plus sur le disque de ce
    # service : elle est hébergée chez Turso (cloud). Plus
    # besoin de disque persistant ici — ce qui tombe bien,
    # puisque le plan Free de Render n'en supporte pas.
    plan: free

    branch: main

    buildCommand: >-
      cd client &&
      npm install &&
      npm run build &&
      cd ../server &&
      npm install &&
      npm run build

    startCommand: cd server && npm start

    healthCheckPath: /api/health

    envVars:
      - key: PORT
        value: 10000

      - key: ADMIN_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false

      # Base de données Turso (cloud, SQLite-compatible).
      # Valeurs à définir manuellement dans Render :
      # Dashboard → ce service → Environment.
      - key: TURSO_DATABASE_URL
        sync: false

      - key: TURSO_AUTH_TOKEN
        sync: false